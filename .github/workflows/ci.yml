name: CI

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    checks:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.10

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Lint
              run: bun run lint

            - name: Typecheck
              run: bun run typecheck

            - name: Test
              run: bun run test

            - name: Build
              run: bun run build

    docker:
        needs: checks
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build container image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  load: true
                  push: false
                  tags: web-spa-template:ci
                  build-args: VITE_API_URL=/api
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Verify nginx SPA serving
              run: |
                  container_name=web-spa-template-ci
                  response_file=$(mktemp)
                  cleanup() {
                      exit_code=$?
                      if [ "$exit_code" -ne 0 ]; then
                          docker logs "$container_name" || true
                      fi
                      docker rm --force "$container_name" || true
                      exit "$exit_code"
                  }
                  trap cleanup EXIT
                  docker run --detach --rm --name web-spa-template-ci --publish 8080:80 \
                      --env BACKEND_API_UPSTREAM=http://127.0.0.1:3000 \
                      web-spa-template:ci
                  is_ready=false
                  for attempt in $(seq 1 10); do
                      if curl --fail --silent --output "$response_file" http://127.0.0.1:8080/; then
                          is_ready=true
                          break
                      fi
                      sleep 1
                  done
                  test "$is_ready" = true
                  grep -Fq '<div id="root"></div>' "$response_file"
                  curl --fail --silent --output "$response_file" http://127.0.0.1:8080/ci-route
                  grep -Fq '<div id="root"></div>' "$response_file"

    publish:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: docker
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Prepare image metadata
              id: metadata
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository }}
                  tags: |
                      type=raw,value=latest
                      type=sha,prefix=sha-

            - name: Publish container image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: ${{ steps.metadata.outputs.tags }}
                  labels: ${{ steps.metadata.outputs.labels }}
                  build-args: VITE_API_URL=/api
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
